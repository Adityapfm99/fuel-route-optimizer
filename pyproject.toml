[project]
name = "fuel-route-optimizer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1,<6.2",
    "numpy>=2.5.4",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["fuelroute/tests"]
